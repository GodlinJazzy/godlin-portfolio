<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#080914" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6" />
  
  <!-- Neural node connections -->
  <circle cx="25" cy="25" r="4" fill="#06b6d4" opacity="0.8" />
  <circle cx="75" cy="25" r="4" fill="#a855f7" opacity="0.8" />
  <circle cx="25" cy="75" r="4" fill="#6366f1" opacity="0.8" />
  <circle cx="75" cy="75" r="4" fill="#ec4899" opacity="0.8" />
  <line x1="25" y1="25" x2="75" y2="75" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="75" y1="25" x2="25" y2="75" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />

  <!-- Center Stylized G -->
  <path d="M64 36 C58 28 42 28 34 36 C24 46 24 60 34 70 C44 80 62 76 66 64 C67 60 67 54 53 54" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
